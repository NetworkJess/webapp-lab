
services:
  web:
    build: ./php    # PHP Version
    ports:
      - "8000:80"    # maps your PC port 80 to container port 8000 - fixes permission issues in the lab
    depends_on:
      - db    # links this container to the db container
    volumes:
     #- ./Spies:/var/www/html #uncomment to use Spies and comment Users
      - ./Users:/var/www/html    #
    environment:
      # Passed to the web app so db.php can read them (see html/db.php)
      MYSQL_DATABASE: ${MYSQL_DATABASE:-my_db}
      MYSQL_USER: ${MYSQL_USER:-Jess}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}

  db:
    image: mysql:latest    # MySQL version
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-my_db}     # create this database on first run
      MYSQL_USER: ${MYSQL_USER:-Jess}              # optional custom user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}     # password for the custom user
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}   # root password
    volumes:
      - ./mysql_data:/var/lib/mysql    # maps ./mysql_data on your PC to /var/lib/mysql in the container

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    platform: linux/amd64   # avoids issues with MacOS and lab environments
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8080:80"
